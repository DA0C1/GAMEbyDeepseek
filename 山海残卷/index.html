<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="description" content="山海残卷 — 水墨卡牌构筑 roguelike。守卷人执符入卷，封印逃逸的异兽。">
<title>山海残卷 · SCROLLS OF SHANHAI</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23efe6d4'/%3E%3Crect x='6' y='6' width='20' height='20' fill='none' stroke='%23b23a2e' stroke-width='2.5'/%3E%3Cpath d='M11 16h10M16 11v10' stroke='%231d1a17' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>
<div id="stage">
  <div id="game"></div>
  <div id="veil"><span>展卷…</span></div>
</div>
<div id="errlog" aria-hidden="true"></div>
<noscript><p style="color:#1d1a17;font-family:serif;text-align:center;margin-top:40vh">需启用 JavaScript 方可展卷。</p></noscript>

<script src="vendor/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
<script>
window.addEventListener('error', function (e) {
  var box = document.getElementById('errlog');
  if (box) box.textContent += '\n' + (e.message || e.error);
});
window.addEventListener('unhandledrejection', function (e) {
  var box = document.getElementById('errlog');
  if (box) box.textContent += '\n' + (e.reason && e.reason.stack ? e.reason.stack : e.reason);
});
</script>
</body>
</html>
